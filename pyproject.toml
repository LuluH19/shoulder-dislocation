[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gestures"
version = "1.0.0"
description = "Reconnaissance de gestes (circle / horizontal / vertical) avec un capteur IMU, un CNN 1D et un ESP32"
requires-python = ">=3.10"
dependencies = ["numpy", "torch", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["gestures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
